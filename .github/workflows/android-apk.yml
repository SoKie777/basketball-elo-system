name: APK Android de test

# Une étape terminée = un tag vX.Y.Z poussé : l'APK est publié dans les Releases du dépôt.
# Lancement manuel possible depuis l'onglet Actions (l'APK est alors dans les artefacts du run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.5.1"
  PROJECT_DIR: tour-des-99-etages

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Godot et les modèles d'export Android
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            "templates/android_debug.apk" "templates/android_release.apk" "templates/version.txt" -d "$tpl"
          ls -la "$tpl"

      - name: Importer le projet et lancer les tests
        run: |
          godot --headless --path "$PROJECT_DIR" --import || true
          godot --headless --path "$PROJECT_DIR" --script res://tests/run_tests.gd -- --sims=50

      - name: Configurer la signature et le SDK Android
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          minor=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          cat > "$HOME/.config/godot/editor_settings-${minor}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-${minor}.tres"

      - name: Numéroter la version
        run: |
          name="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || name="0.0.${GITHUB_RUN_NUMBER}-dev"
          sed -i "s/^version\/name=.*/version\/name=\"${name}\"/; s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" \
            "$PROJECT_DIR/export_presets.cfg"
          echo "APK_NAME=tour99-${name}.apk" >> "$GITHUB_ENV"

      - name: Exporter l'APK
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p build
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/$APK_NAME"
          test -s "build/$APK_NAME"
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: build/${{ env.APK_NAME }}

      - name: Publier la Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.APK_NAME }}
          prerelease: true
          body: |
            APK de test (debug) de La Tour des 99 Étages, version ${{ github.ref_name }}.
            Sur Android : télécharger le fichier .apk, l'ouvrir, autoriser l'installation depuis cette source.
