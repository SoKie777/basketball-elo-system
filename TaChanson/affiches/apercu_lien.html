<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu du lien · Ta Chanson (1200×630)</title>
<!-- Image affichée quand on partage le lien du site sur WhatsApp ou Facebook : exportée en site/og.png -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--orange:#F77F00;--orange-deep:#D96400;--green:#009E60;--green-deep:#00663F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Nunito",sans-serif;color:#fff;background:linear-gradient(120deg,#FF9A2E 0%,var(--orange) 45%,#D96400 100%);position:relative}
.green{position:absolute;right:-180px;bottom:-380px;width:820px;height:820px;border-radius:50%;background:var(--green)}
.disc{position:absolute;right:120px;top:130px;width:330px;height:330px;border-radius:50%;background:repeating-radial-gradient(circle,#1d140b 0 3px,#2a1c0f 3px 8px);box-shadow:0 30px 60px rgba(60,20,0,.35),0 0 0 10px rgba(255,255,255,.12)}
.disc::before{content:"";position:absolute;inset:108px;border-radius:50%;background:conic-gradient(var(--orange) 0 50%,var(--green) 50% 100%);box-shadow:0 0 0 7px #fff}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff}
.page{position:relative;z-index:1;padding:64px 70px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px;font-family:"Baloo 2";font-weight:800;font-size:42px;line-height:1}
.mark{width:62px;height:62px;border-radius:18px;background:#fff;display:grid;place-items:center}
.mark svg{width:36px;height:36px}
h1{font-family:"Baloo 2";font-weight:800;font-size:96px;line-height:.92;margin-top:44px;letter-spacing:-1px;max-width:680px}
.sub{margin-top:22px;display:inline-block;align-self:flex-start;background:#fff;color:var(--orange-deep);font-family:"Baloo 2";font-weight:800;font-size:44px;line-height:1;padding:14px 28px 8px;border-radius:999px}
.ia{margin-top:auto;font-weight:800;font-size:24px;opacity:.95}
</style>
</head>
<body>
<div class="green"></div>
<div class="disc"></div>
<div class="page">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24"><path fill="#F77F00" d="M9 18.5a3 3 0 1 1-2-2.83V5l12-2.5v12a3 3 0 1 1-2-2.83V6.9L9 8.6z"/></svg></div>
    Ta Chanson
  </div>
  <h1>Ton prénom en musique</h1>
  <span class="sub">livré en 24 h · dès 1 500 F</span>
  <div class="ia">Chansons créées avec l'aide de l'IA, écrites sur mesure.</div>
</div>
</body>
</html>
