<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Ta Chanson</title>

<style>
:root{--orange:#F77F00;--green:#009E60;--cream:#FFF8EF;--ink:#1F1A14;color-scheme:light}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px 16px}
h1{font-size:2rem;margin:0 0 .4em}
p{color:#6A5C4D;margin:0 0 1.4em}
a{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;font-weight:800;padding:14px 24px;border-radius:999px}
.note{font-size:3rem;margin-bottom:.2em}
</style>
</head>
<body>
<main>
  <div class="note" aria-hidden="true">♪</div>
  <h1>Oups, cette page n'existe pas.</h1>
  <p>Mais ta chanson, elle, peut exister dès demain.</p>
  <a href="/">Retour à l'accueil</a>

</html>
